<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>StreamX Live TV</title>
  <link rel="stylesheet" href="style.css">
  <!-- HLS.js library for streaming m3u8 videos -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <!-- ================= AUTH SCREEN (LOGIN / REGISTER) ================= -->
  <div id="authScreen" class="overlay-screen">
    <div class="auth-box">
      <div class="logo">StreamX</div>
      
      <!-- Auth Tabs -->
      <div class="auth-tabs">
        <button id="tabLoginBtn" class="tab-btn active" onclick="switchAuthTab('login')">লগইন</button>
        <button id="tabRegisterBtn" class="tab-btn" onclick="switchAuthTab('register')">রেজিস্টার</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <input type="tel" id="loginPhone" placeholder="ফোন নম্বর (যেমন: 01700000000)" required>
        <input type="password" id="loginPassword" placeholder="পাসওয়ার্ড" required>
        <button type="submit" id="loginSubmitBtn">লগইন করুন</button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
        <input type="text" id="regName" placeholder="আপনার সম্পূর্ণ নাম" required>
        <input type="tel" id="regPhone" placeholder="ফোন নম্বর (যেমন: 01700000000)" required>
        <input type="password" id="regPassword" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" required>
        <button type="submit" id="regSubmitBtn">একাউন্ট তৈরি করুন</button>
      </form>

      <p id="authMessage" class="msg-box"></p>
    </div>
  </div>

  <!-- ================= SUBSCRIPTION SCREEN ================= -->
  <div id="subScreen" class="overlay-screen" style="display: none;">
    <div class="sub-box">
      <h2>সাবস্ক্রিপশন প্রয়োজন</h2>
      <p>লাইভ টিভি দেখতে যেকোনো একটি প্যাকেজ বেছে নিয়ে পেমেন্ট করুন।</p>
      
      <div id="packageList" class="package-list">
        <!-- Dynamic Packages from Firestore -->
      </div>

      <div id="paymentFormBox" class="payment-box" style="display: none;">
        <h3>পেমেন্ট সম্পন্ন করুন</h3>
        <p id="selectedPkgText" class="pkg-highlight"></p>
        
        <!-- Bangla QR Payment Banner -->
        <div class="qr-container">
          <p class="qr-title">বিকাশ অ্যাপ দিয়ে নিচের QR কোডটি স্ক্যান করে অথবা নম্বর দেখে পেমেন্ট করুন:</p>
          <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg06gZyTA-e5Oadc95UJ3gmgFy6nzIpVkWYNdhAvmaJ437hfCvFkMX4FMJp3rwFBYBt9Bj7x7cvbO1Hv5vbDh9GcoWVXltwxUlW9QL7cchFzImw4m35fnc2FP0Pr9lqk-zb_uhpwP3bNBokVTs6-cK02FhI6Rm5xVqayNY5b1CfLk5wM3yXy8IArzDVO0oV/s780/1000094124.png" alt="bKash Payment QR" class="qr-image">
        </div>

        <input type="text" id="trxIdInput" placeholder="Transaction ID (TrxID) লিখুন" required>
        <button onclick="submitPaymentRequest()">পেমেন্ট সাবমিট করুন</button>
        <button class="btn-cancel" onclick="cancelPaymentSelect()">বাতিল</button>
      </div>

      <p id="subMessage" class="msg-box"></p>
      <button class="btn-logout" onclick="handleLogout()">লগআউট করুন</button>
    </div>
  </div>

  <!-- ================= MAIN APP SCREEN ================= -->
  <div id="mainApp" style="display: none;">
    <header>
      <div class="logo">StreamX</div>
      <div class="user-info">
        <span id="userBadge" class="badge">Active</span>
        <button onclick="handleLogout()" class="btn-sm">Logout</button>
      </div>
    </header>

    <div class="categories">
      <button class="cat-btn active" onclick="selectCategory('sports', this)">Sports</button>
      <button class="cat-btn" onclick="selectCategory('news', this)">News</button>
      <button class="cat-btn" onclick="selectCategory('bangla', this)">Bangla</button>
      <button class="cat-btn" onclick="selectCategory('drama', this)">Drama</button>
    </div>

    <div class="main">
      <div class="player-box">
        <video id="player" controls playsinline></video>
      </div>
      <div class="status" id="status">ক্যাটাগরি সিলেক্ট করে চ্যানেল বাছাই করুন</div>
      <div class="channel-list" id="channelList">
        <!-- Dynamic Channels from Firestore -->
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
