<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamX Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Login Page -->
  <div id="loginPage" class="login-container">
    <div class="login-box">
      <h2>StreamX Admin</h2>
      <p>শুধুমাত্র অ্যাডমিন লগইন করতে পারবেন</p>
      <input type="email" id="adminEmail" placeholder="Admin Email" value="tarekmahmud821@gmail.com">
      <input type="password" id="adminPassword" placeholder="Password">
      <button onclick="adminLogin()">Login</button>
      <p id="loginError" class="error"></p>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="dashboard" style="display: none;">
    <header>
      <div class="logo">StreamX Admin</div>
      <div class="header-right">
        <span id="adminName"></span>
        <button onclick="logout()">Logout</button>
      </div>
    </header>

    <div class="sidebar">
      <button class="nav-btn active" onclick="showSection('packages')">Packages</button>
      <button class="nav-btn" onclick="showSection('users')">Users</button>
      <button class="nav-btn" onclick="showSection('payments')">Payments</button>
      <button class="nav-btn" onclick="showSection('channels')">Channels</button>
    </div>

    <main>

      <!-- Packages Section -->
      <section id="packagesSection" class="section">
        <h2>Subscription Packages</h2>
        <div class="form-box">
          <input type="text" id="pkgName" placeholder="Package Name (e.g. 1 Month)">
          <input type="number" id="pkgPrice" placeholder="Price (BDT)">
          <input type="number" id="pkgDays" placeholder="Duration (Days)">
          <button onclick="addPackage()">Add / Update Package</button>
        </div>
        <div id="packagesList" class="list"></div>
      </section>

      <!-- Users Section -->
      <section id="usersSection" class="section" style="display:none;">
        <h2>Users Management</h2>
        <div id="usersList" class="list"></div>
      </section>

      <!-- Payments Section -->
      <section id="paymentsSection" class="section" style="display:none;">
        <h2>Pending Payments</h2>
        <div id="paymentsList" class="list"></div>
      </section>

      <!-- Channels Section -->
      <section id="channelsSection" class="section" style="display:none;">
        <h2>Channel Management</h2>
        <div class="form-box">
          <input type="text" id="chName" placeholder="Channel Name">
          <input type="text" id="chLogo" placeholder="Logo URL">
          <input type="text" id="chUrl" placeholder="Stream URL (.m3u8)">
          <select id="chCategory">
            <option value="sports">Sports</option>
            <option value="news">News</option>
            <option value="bangla">Bangla</option>
            <option value="drama">Drama</option>
          </select>
          <button onclick="addChannel()">Add Channel</button>
        </div>
        <div id="channelsList" class="list"></div>
      </section>

    </main>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
